
name: CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify application and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Lint Firestore security rules
        run: bunx eslint firestore.rules

      - name: Test Firestore security rules
        run: >-
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only firestore
          --project museo-404-rules-test
          "node --experimental-strip-types --test firestore.rules.test.ts && node --experimental-strip-types --test firestore.rules.guestbook.test.ts"
